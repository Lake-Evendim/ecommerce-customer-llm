# DPO training config

# 这里填你的 SFT LoRA adapter 输出目录
sft_adapter_path: outputs/checkpoints/sft_lora

train_file: data/processed/dpo_train.jsonl
valid_file: data/processed/dpo_valid.jsonl

output_dir: outputs/checkpoints/dpo_lora
log_dir: outputs/logs/dpo

max_length: 2048

num_train_epochs: 1
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 8

learning_rate: 5.0e-6
warmup_ratio: 0.03
weight_decay: 0.0
beta: 0.1

logging_steps: 10
eval_steps: 50
save_steps: 50
save_total_limit: 2

bf16: true
gradient_checkpointing: true
seed: 42

# smoke test 用。正式训练时改成 -1
max_steps: -1
